name: Build & Release UCABA

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Compilar Instalador y Crear Release
    runs-on: windows-latest

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configurar Node.js (para empaquetar VSIX)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Dependencias de Compilación
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Ejecutar Suite de Pruebas Unitarias
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      - name: Empaquetar Extensión de VS Code (VSIX)
        working-directory: ./extension-vscode
        run: |
          npx -y @vscode/vsce package --no-git-tag-version

      - name: Compilar ucaba.exe e Instalador_UCABA.exe
        run: |
          python build_installer.py

      - name: Generar Notas de Release y Checksums SHA-256
        run: |
          python .github/scripts/generate_release_notes.py

      - name: Publicar Release Oficial en GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: UCABA ${{ env.RELEASE_TAG }} - Instalador Oficial y Extensión
          body_path: release_notes.md
          files: |
            dist/Instalador_UCABA.exe
            dist/ucaba.exe
            extension-vscode/*.vsix
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
